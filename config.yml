# ==========================================================================
#  AI JOB HUNTER -- Tuning Surface
#  Everything here is safe to edit and commit. Secrets live in .env / GitHub
#  Secrets and are NEVER stored in this file.
# ==========================================================================

# -- Master CV: resolution order --------------------------------------------
# The CV is personal data, so the cloud never reads a file -- it reads the
# CV_TEXT secret. These paths are for LOCAL runs and for generating that secret.
#
# Resolution is: CV_TEXT env  ->  MASTER_CV_B64 env  ->  CV_PATH env  ->  the
# list below, in order  ->  cached extraction. The first source that yields
# usable text wins, so a missing primary file falls through silently instead of
# failing the run.
#
# `~` expands to your home directory, which keeps the username out of a public
# repository while still resolving correctly on this machine.
cv:
  paths:
    - "~/OneDrive/Desktop/NEW SHAPTER/Hossam_Eldefrawy_CV.pdf"   # primary
    - "~/OneDrive/Desktop/NEW SHAPTER/Hossam Eldefrawy CV.pdf"   # fallback
    - "assets/master_cv.pdf"                                     # repo-local
  # Where `python setup_wizard.py --extract-cv` writes the sanitised text.
  export_path: "secrets/CV_TEXT.txt"
  # GitHub rejects a secret larger than 64 KB. The exporter refuses to write
  # past this and tells you rather than producing a secret that cannot be set.
  max_secret_bytes: 65536

engine:
  # Alert only when Gemini scores a job at/above this. 0-100.
  match_threshold: 75
  # Jobs evaluated per Gemini call. Higher = fewer API calls = less quota burn.
  eval_batch_size: 8
  # Gemini batches run in parallel. Each call is mostly network wait, so this
  # is the difference between a ~3-minute and a ~1-minute evaluation phase.
  # Measured: at 3, a 15-batch run tripped the free tier's per-minute limit
  # repeatedly and needed 31 calls to land 15 batches -- the backoff recovered
  # every one, but the retries cost more time than the parallelism saved.
  # 2 is the tested default. Raise it only on a paid key.
  eval_concurrency: 2
  # Hard ceiling on jobs sent to Gemini per run (protects the free-tier quota).
  max_evaluations_per_run: 120
  # Hard ceiling on WhatsApp messages per run (protects against alert storms).
  max_alerts_per_run: 12
  # Seconds between WhatsApp sends. CallMeBot throttles aggressively below ~6s.
  alert_interval_seconds: 8
  # Ignore postings older than this. Telegram/RSS often resurface stale posts.
  max_job_age_days: 21
  # Concurrent scraper workers.
  scraper_concurrency: 8
  # Per-request HTTP timeout (seconds).
  http_timeout: 25
  # Drop a job before it ever reaches Gemini unless it clears this cheap
  # lexical pre-filter score. Saves a large share of AI quota. 0 disables it.
  prefilter_min_score: 2

gemini:
  # Tried in order; first model that answers wins. Verified live 2026-08-19.
  model_chain:
    - gemini-3.5-flash
    - gemini-2.5-flash
    - gemini-3.5-flash-lite
  temperature: 0.15
  max_output_tokens: 8192
  # Retry/backoff for 429 (rate limit) and 5xx (transient).
  max_retries: 4
  backoff_base_seconds: 2.5

