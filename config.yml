# -- SOURCE 1: LinkedIn public guest endpoint (no login, no cookies) --------
# Highest-signal source. Verified returning fresh GCC roles.
linkedin:
  enabled: true
  # Restrict to postings from the last N seconds (604800 = 7 days).
  recency_seconds: 604800
  pages_per_query: 2          # 10 results per page
  # Requests spent fetching FULL descriptions for the best cards each run.
  # Each costs ~2.5s (host throttle), so this is the main runtime dial.
  enrich_budget: 22
  # ~14 queries x ~3 locations x 2 pages ~= 84 requests ~= 3.5 min. LinkedIn is
  # the slowest source; trim `locations` here first if runs get too long.
  queries:
    # -- core VoIP / telephony ------------------------------------------
    - keywords: "VoIP Engineer"
      locations: ["United Arab Emirates", "Saudi Arabia", "Qatar", "Egypt"]
    - keywords: "SIP OR RTP OR Telephony Engineer"
      locations: ["United Arab Emirates", "Saudi Arabia", "Kuwait"]
    - keywords: "Asterisk OR Issabel OR FreePBX"
      locations: ["United Arab Emirates", "Egypt", "Saudi Arabia"]
    - keywords: "Unified Communications Engineer"
      locations: ["United Arab Emirates", "Saudi Arabia", "Qatar"]
    - keywords: "Contact Center Engineer"
      locations: ["United Arab Emirates", "Qatar", "Saudi Arabia"]
    - keywords: "Telecom Network Engineer"
      locations: ["Oman", "Bahrain", "Kuwait", "Qatar"]
    # -- application / IT support ----------------------------------------
    - keywords: "IT Application Support Engineer"
      locations: ["United Arab Emirates", "Saudi Arabia", "Qatar", "Egypt"]
    - keywords: "IT Support Engineer"
      locations: ["Dubai, United Arab Emirates", "Riyadh, Saudi Arabia", "Oman"]
    - keywords: "Technical Support Engineer"
      locations: ["Kuwait", "Bahrain", "Oman", "Qatar"]
    - keywords: "Service Desk OR Help Desk Engineer"
      locations: ["United Arab Emirates", "Saudi Arabia", "Egypt"]
    # -- systems / Linux ---------------------------------------------------
    - keywords: "Linux System Administrator"
      locations: ["United Arab Emirates", "Saudi Arabia", "Egypt"]
    - keywords: "System Engineer Infrastructure"
      locations: ["Qatar", "Kuwait", "Bahrain"]
    # -- ERP / POS ---------------------------------------------------------
    - keywords: "Odoo Functional OR Technical Consultant"
      locations: ["United Arab Emirates", "Egypt", "Saudi Arabia"]
    - keywords: "POS Support Engineer"
      locations: ["United Arab Emirates", "Egypt", "Saudi Arabia"]

# -- SOURCE 2: Telegram public channels (t.me/s/ web preview, zero auth) ----
# VERIFIED LIVE on 2026-08-19. Add your own channels here -- run
# `python discover_channels.py @name1 @name2` to validate before adding.
telegram:
  enabled: true
  messages_per_channel: 40
  # Every channel below was AUDITED on 2026-08-19 and confirmed to be posting
  # RECENTLY and to carry real IT/engineering signal. Dozens of the obvious
  # names (@gulfjobsin, @jobsgulf, @ciscojobs, @Egypt_Jobs ...) exist but are
  # dormant or off-topic, so they were deliberately excluded.
  # Columns: last post age | IT-keyword density | subscribers
  channels:
    - telecomcareers        #  5d | IT 67 |  9.9K  <- best telecom/VoIP signal
    - FreeJobsInDubai       #  0d | IT 43 | 15.4K
    - gulfjobexpress        #  6d | IT 10 |  6.3K
    - qatarjobsvacancy      #  0d | IT  8 |    91
    - gulfwalkins           #  0d | IT  5 | 12.6K
    - emiratesjobs          #  7d | IT  - |  6.1K
    # -- ADD YOUR OWN BELOW (e.g. the Mohamed Shaaban channel) -----------
    # Telegram has NO public channel-search API, so a channel can only be
    # added by its exact @username. Validate before adding:
    #     python discover_channels.py @name1 @name2 --add
    # The auditor reports freshness, IT relevance and subscriber count, and
    # refuses to add anything dormant.

# -- SOURCE 3: Telegram MTProto USER CLIENT (your joined private groups) ----
# Signs in as YOU over Telegram's native protocol, so it reads the chats the
# public web preview cannot see at all: private recruitment groups you were
# invited to, supergroups, and channels with the preview disabled.
#
# Requires a one-time interactive login:   python auth_telegram.py
# Verify it afterwards with:               python check_telegram.py
#
# Safety: this only ever READS. It never sends, joins, reacts or forwards, it
# paces itself between chats, and it obeys Telegram's flood-wait instead of
# retrying through it.
telegram_user:
  enabled: true

  # poll = walk your dialogs each run (works on GitHub Actions).
  # live = react to messages the instant they arrive; needs a persistent
  #        process, so it only applies to `python main.py --live`.
  mode: poll

  messages_per_dialog: 60      # per chat, per run (cursor means little repeat work)
  max_dialogs: 250             # how far down your dialog list to look
  lookback_hours: 72           # ignore anything older on first sight
  pause_between_chats_seconds: 0.4

  # Which of your chats to read. Empty include_chats = EVERY group/channel you
  # have joined. Entries match a chat title substring, an @username, or a
  # numeric chat id.
  # Measured 2026-08-19 with `check_telegram.py --scan 168 --suggest`:
  # of 46 chats that passed the type filter, exactly 3 produced anything in a
  # full week. Narrowing to those cuts the dialog sweep and the flood-wait
  # risk with no loss of yield.
  #
  # TRADE-OFF: with this list set, a NEW group you join is ignored until you
  # add it here. Re-run --suggest occasionally, or empty this list to go back
  # to watching everything.
  include_chats:
    - "Software & IT Jobs in Egypt"   # 7 hiring posts/wk, 10 tech hits -- the real one
    - "Ahmed mohammed"                # 6/wk, but mostly courses and scholarships;
                                      # it did surface a US Embassy help-desk role
    - "سهم مصر"                        # 1/wk, and that was an economics bulletin
                                      # matching "أنظمة/شبكات" by accident. Drop it
                                      # if it never yields a real vacancy.
  exclude_chats:
    - "saved messages"
  include_groups: true         # groups + supergroups
  include_channels: true       # broadcast channels
  include_private_chats: false # your 1:1 DMs -- off by default, deliberately

  # Require a technical keyword (VoIP/SIP/Issabel/Asterisk/IT support/Linux/
  # Odoo/POS/telecom/...) in addition to a hiring keyword. Set false to widen
  # the net and let Gemini do all the judging (costs more quota).
  require_tech_match: true

# -- SOURCE 4: Free structured job APIs (clean JSON, no scraping) -----------
job_apis:
  enabled: true
  sources:
    arbeitnow: true         # ~176 live postings, global + remote
    remoteok: true          # ~100 remote tech roles
    jobicy: true            # ~50 remote roles
    himalayas: true         # ~20 remote roles
    remotive: true          # ~17 remote roles
    themuse: true           # global, filterable

# -- SOURCE 5: talent.com regional boards (GCC-native, bot-friendly) --------
# The most productive Gulf-native board that still serves clean HTML to a
# plain HTTP client. Bayt / GulfTalent / Naukrigulf / Wuzzuf / Indeed all
# answer HTTP 403; talent.com does not, and it aggregates much of the same
# inventory. Verified returning real UAE postings on 2026-08-19.
talent:
  enabled: true
  max_per_query: 20
  countries: [ae, sa, qa, kw, om, bh, eg]
  terms:
    - "VoIP engineer"
    - "SIP telephony"
    - "IT support engineer"
    - "application support"
    - "unified communications"
    - "Odoo support"
    - "contact center engineer"

# -- SOURCE 6: Tanqeeb -- the Arab world's largest bot-accessible aggregator --
# The most valuable GCC/Egypt source in the system, and the only one that
# searches natively in ARABIC. Verified live 2026-08-19 across all seven
# subdomains; Arabic queries return real results ("دعم فني" -> اخصائي دعم فنى).
#
# Two quirks are handled in scrapers/tanqeeb.py, both silent failure modes:
#   * the search parameter is `keywords` (PLURAL) -- every other spelling
#     returns HTTP 200 with the WRONG 20 jobs;
#   * a zero-result search returns generic filler rather than nothing, so
#     results are checked against the query before being emitted.
# Keep terms SHORT: multi-word queries are ANDed and usually match nothing.
# CLOUD CAVEAT (measured 2026-08-19): Tanqeeb blocks GitHub Actions IP ranges.
# Every subdomain tripped the circuit breaker after 4 consecutive failures and
# the source returned 0 from the runner, versus 928 from a home connection. It
# stays enabled because it is the best GCC source when the bot runs on a VPS,
# Docker or your own machine -- and it costs only ~18s to fail fast in the cloud.
tanqeeb:
  enabled: true
  max_per_query: 20
  recency_days: 14
  countries: [egypt, saudi, uae, qatar, kuwait, oman, bahrain]
  terms:
    # English
    - "it support"
    - "application support"
    - "technical support"
    - "network engineer"
    - "system administrator"
    - "odoo"
    - "linux"
    - "telecom"
    - "voip"
    - "call center"
    # Arabic -- these reach postings the English terms never surface
    - "دعم فني"
    - "مهندس شبكات"
    - "سنترالات"
    - "تقنية معلومات"
    - "نقاط بيع"

# -- SOURCE 7: Search-engine proxy for boards that block direct scraping ----
# Reaches Bayt / GulfTalent / Naukrigulf / Wuzzuf through Google News RSS,
# which is the ONLY free path to them. Read the honest trade-off first:
#   * links are opaque news.google.com redirects -- tappable from WhatsApp and
#     they do land on the posting, but they are not clean canonical URLs;
#   * precision is lower than a real job API (listing pages sneak in).
# Bing RSS ignores `site:` and DuckDuckGo bot-challenges, so neither is wired
# up. Set enabled: false if the extra noise annoys you -- coverage of the
# blocked GCC boards is the only thing you lose.
search_proxy:
  enabled: true
  max_items_per_query: 25
  engines: ["google_news"]
  site_queries:
    - site: bayt.com
      terms: ["VoIP engineer", "IT support engineer", "application support"]
    - site: gulftalent.com
      terms: ["VoIP", "telecom engineer", "IT support"]
    - site: naukrigulf.com
      terms: ["VoIP engineer", "IT support engineer", "Odoo"]
    - site: wuzzuf.net
      terms: ["VoIP", "Odoo", "IT support"]

# -- SOURCE 8: Plain RSS job feeds ------------------------------------------
rss:
  enabled: true
  feeds:
    - name: WeWorkRemotely-DevOps
      url: https://weworkremotely.com/categories/remote-devops-sysadmin-jobs.rss
    - name: WeWorkRemotely-Support
      url: https://weworkremotely.com/categories/remote-customer-support-jobs.rss
    - name: Jobicy
      url: https://jobicy.com/?feed=job_feed

# -- SOURCE 9: Facebook public recruitment posts (best-effort) --------------
# Facebook aggressively blocks unauthenticated scraping. Without a cookie
# this falls back to search-engine indexing of public FB job posts.
facebook:
  enabled: true
  # Only used when the FACEBOOK_COOKIE secret is set (opt-in, your own account).
  pages: []
  search_terms:
    - "VoIP engineer Egypt hiring"
    - "IT support engineer Dubai hiring"
    - "Odoo support Cairo hiring"

# -- Alert delivery ---------------------------------------------------------
notifications:
  # If CallMeBot refuses, deliver the alert to your Telegram Saved Messages
  # instead. This is not a nicety: CallMeBot answers GitHub Actions runners
  # with HTTP 403 (it blocks datacentre IPs), so without this a scheduled run
  # can find real matches and deliver none of them. Verified: the identical
  # request returns 200 from a home connection and 403 from the cloud.
  telegram_fallback: true

  # Send a run summary even when nothing matched (quiet heartbeat).
  send_heartbeat: false
  # Alert if the pipeline itself breaks (scrapers all dead, Gemini down).
  send_failure_alerts: true
  # Don't re-send the same failure more than once per N minutes.
  failure_cooldown_minutes: 180

  # -- Source health & audit digest ----------------------------------------
  # A WhatsApp message listing EVERY source scraped this run, with a sample
  # posting from each -- proof that no platform is silently blocked.
  send_source_digest: true
  # Hours between routine digests. The bot runs every 30 min; a digest on every
  # run would be ~48 messages/day and would bury the actual job alerts, so this
  # is throttled. Set to 0 to send one after every single run.
  digest_interval_hours: 12
  # Send a digest IMMEDIATELY (ignoring the interval) when a source fails or
  # returns nothing -- that is the moment the report is actually worth reading.
  digest_on_source_failure: true
  # Don't repeat a failure-triggered digest more often than this.
  digest_failure_cooldown_minutes: 120

# ==========================================================================
#  PHASE 2 -- auto-apply & interview copilot (LOCAL ONLY)
#  Needs a real browser and writes to the private vault, so it never runs on
#  the GitHub Actions schedule. Drive it with `python main.py --apply` etc.
# ==========================================================================
auto_apply:
  enabled: true

  # Only draft applications at or above this score. Higher than the alert
  # threshold on purpose: an alert costs you a glance, an application costs
  # your name.
  min_score: 80

  # LinkedIn is NEVER automated. Its anti-automation enforcement is the
  # strictest of any board here and a flagged account would cost the single
  # best source in the whole system. LinkedIn matches are alert-only.
  never_automate:
    - linkedin

  # A drafted application waits for explicit approval before submission.
  # Set false ONLY if you are willing to have Gemini's answers submitted in
  # your name unreviewed.
  require_approval: true

  # Seconds to let a page settle before reading its form.
  page_timeout: 45
  # Keep the browser visible. Assisted registration REQUIRES this -- you solve
  # the CAPTCHA. Headless is fine once an account already exists.
  headed: true

  # Identity overrides. These beat whatever Gemini reads out of the CV, because
  # the model should not have the last word on your own contact details.
  identity:
    email: "hossam.eldefrawy.dev@gmail.com"

  # Boards the assisted registration flow knows how to open.
  platforms:
    - name: Tanqeeb
      url: "https://www.tanqeeb.com/register"
      login_url: "https://www.tanqeeb.com/login"
    - name: Wuzzuf
      url: "https://wuzzuf.net/signup/candidate"
      login_url: "https://wuzzuf.net/login"
    - name: Talent.com
      url: "https://ae.talent.com/register"
      login_url: "https://ae.talent.com/login"

# -- Inbound interview / status email monitor ------------------------------
email_monitor:
  enabled: true
  imap_host: imap.gmail.com
  imap_port: 993
  mailbox: INBOX
  # Look back this far on the first run; afterwards only new mail is read.
  lookback_days: 14
  # Read at most this many unread messages per pass.
  max_messages: 40
  # Messages are left UNREAD unless they turn out to be job-related, so the
  # monitor never disturbs personal mail.
  mark_seen_when_classified: true
  poll_interval_minutes: 15
