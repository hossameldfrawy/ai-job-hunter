# ==========================================================================
#  AI JOB HUNTER -- Tuning Surface
#  Everything here is safe to edit and commit. Secrets live in .env / GitHub
#  Secrets and are NEVER stored in this file.
# ==========================================================================

engine:
  # Alert only when Gemini scores a job at/above this. 0-100.
  match_threshold: 75
  # Jobs evaluated per Gemini call. Higher = fewer API calls = less quota burn.
  eval_batch_size: 8
  # Gemini batches run in parallel. Each call is mostly network wait, so this
  # is the difference between a ~3-minute and a ~1-minute evaluation phase.
  # Keep it low: the free tier limits REQUESTS PER MINUTE, and 429s are handled
  # by backoff but cost latency. 3 is a safe, tested default.
  eval_concurrency: 3
  # Hard ceiling on jobs sent to Gemini per run (protects the free-tier quota).
  max_evaluations_per_run: 120
  # Hard ceiling on WhatsApp messages per run (protects against alert storms).
  max_alerts_per_run: 12
  # Seconds between WhatsApp sends. CallMeBot throttles aggressively below ~6s.
  alert_interval_seconds: 8
  # Ignore postings older than this. Telegram/RSS often resurface stale posts.
  max_job_age_days: 21
  # Concurrent scraper workers.
  scraper_concurrency: 8
  # Per-request HTTP timeout (seconds).
  http_timeout: 25
  # Drop a job before it ever reaches Gemini unless it clears this cheap
  # lexical pre-filter score. Saves a large share of AI quota. 0 disables it.
  prefilter_min_score: 2

gemini:
  # Tried in order; first model that answers wins. Verified live 2026-08-19.
  model_chain:
    - gemini-3.5-flash
    - gemini-2.5-flash
    - gemini-3.5-flash-lite
  temperature: 0.15
  max_output_tokens: 8192
  # Retry/backoff for 429 (rate limit) and 5xx (transient).
  max_retries: 4
  backoff_base_seconds: 2.5

