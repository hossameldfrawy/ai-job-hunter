[pytest]
# `tests/` only. Pointing pytest at the repository root would collect
# test_imap_auth.py, which is an interactive DIAGNOSTIC that dials a real IMAP
# server -- useful to run by hand, catastrophic in a suite that must never
# touch the network.
testpaths = tests

# Warnings are failures. A DeprecationWarning from our own code is a bug
# report with a due date; letting the suite stay green through it is how the
# 3.14 upgrade turns into an outage.
filterwarnings =
    error
    # Third-party noise we do not control. httplib2 (a google-api-python-client
    # dependency) builds its auth grammar with pyparsing APIs that pyparsing
    # itself has deprecated. Nothing here is actionable from this repository.
    ignore::DeprecationWarning:httplib2.*
    ignore::DeprecationWarning:pyparsing.*
    ignore::DeprecationWarning:google.*

addopts =
    --strict-markers
    --strict-config
    -ra
